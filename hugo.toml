baseURL = "https://blog.dibrain.dev/"   # dibrain.dev 는 앱·도구 첫 화면(hub/), 블로그는 하위 주소
title = "DigitalBrain"
theme = "PaperMod"

defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

enableRobotsTXT = true
buildDrafts = false
buildFuture = true      # 이 사이트는 예약 발행을 하지 않는다. false 면 시각이 몇 분만 앞서도
                        # 글이 소리 없이 사라진다(2026-09-09 사고). true 면 시각이 조금 틀릴 뿐
                        # 글은 살아 있고 눈에 띈다. 날짜 정확성은 스킬 1번의 검사로 지킨다.
buildExpired = false

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/:year/:month/:day/:slug/"
  guides = "/guides/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[minify]
  disableXML = true
  minifyOutput = true
  # 소유확인 메타 태그를 그대로 두기 위해 속성 따옴표를 지우지 않는다(네이버 확인기가 원형을 찾는다).
  [minify.tdewolff.html]
    keepQuotes = true

[params]
  env = "production"
  defaultTheme = "auto"
  disableThemeToggle = false
  disableLangToggle = false

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  hideSummary = false
  disableSpecial1stPost = true
  disableScrollToTop = false

  # Google AdSense publisher ID (예: "ca-pub-XXXXXXXXXXXXXXXX")
  # 승인 전에는 빈 값으로 두면 스크립트가 삽입되지 않습니다.
  adsense = "ca-pub-3496526935001350"

  # 네이버 서치어드바이저 사이트 소유확인 값(HTML 태그 방식의 content 값만).
  # https://searchadvisor.naver.com 에서 사이트를 등록하면 나온다. 비면 태그가 안 나간다.
  naverSiteVerification = "e8c3750c60328de4830bf67025ad9933b9452ebd"   # blog.dibrain.dev 등록용. dibrain.dev 용 값은 hub/index.html

  # Google Analytics 4 measurement ID (예: "G-XXXXXXXXXX")
  googleAnalytics = "G-3MH93TXQTM"

  # 뉴스레터: 정적 사이트라 백엔드가 없다. 외부 서비스(Buttondown/Mailchimp 등)의
  # 폼 action URL 을 넣으면 구독 폼이 나오고, 비어 있으면 RSS 안내만 나온다.
  [params.newsletter]
    action = ""

  # 카카오톡 공유. developers.kakao.com 앱의 JavaScript 키. 비면 버튼이 안 나온다.
  [params.kakao]
    jsKey = ""

  [params.cover]
    hiddenInList = false      # 목록에 썸네일로 노출. 글자만 있으면 자동 생성된 로그처럼 읽힌다.
    hiddenInSingle = false
    responsiveImages = false
    linkFullImages = false

  [params.assets]
    disableHLJS = false
    disableFingerprinting = true
    favicon = "/icons/blog-pen.ico"
    favicon16x16 = "/icons/blog-pen-16.png"
    favicon32x32 = "/icons/blog-pen-32.png"
    apple_touch_icon = "/icons/blog-pen-apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"

  [params.label]
    text = "DigitalBrain"
    # 자체 제작 마크(라이선스 문제 없음). 나머지 아이콘은 Lucide(ISC) 기하를 따릅니다.
    iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="22" fill="#2f6fed"/><path fill="#fff" d="M25.5 24H40.5a3.5 3.5 0 0 1 3.5 3.5V68.5a3.5 3.5 0 0 1-3.5 3.5H25.5a3.5 3.5 0 0 1-3.5-3.5V27.5a3.5 3.5 0 0 1 3.5-3.5Z M49 23.2a24.8 24.8 0 0 1 0 49.6Z"/></svg>'
    iconHeight = 22

  # 링크 공유 시 기본 미리보기 이미지 (글에 cover.image가 없을 때)
  images = ["og-default.png"]

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

