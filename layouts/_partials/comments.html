{{- /* giscus (GitHub Discussions). 네 값이 모두 채워졌을 때만 나온다.
       값은 https://giscus.app 에서 저장소를 넣으면 나온다. 추측해서 넣지 않는다. */}}
{{- $g := site.Params.giscus }}
{{- if and $g $g.repo $g.repoId $g.category $g.categoryId }}
<section class="td-comments">
  <h2 class="td-section">{{ if eq .Language.Lang "ko" }}댓글{{ else }}Comments{{ end }}</h2>
  <script src="https://giscus.app/client.js"
      data-repo="{{ $g.repo }}"
      data-repo-id="{{ $g.repoId }}"
      data-category="{{ $g.category }}"
      data-category-id="{{ $g.categoryId }}"
      data-mapping="pathname"
      data-strict="1"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="top"
      data-theme="preferred_color_scheme"
      data-lang="{{ if eq .Language.Lang "ko" }}ko{{ else }}en{{ end }}"
      data-loading="lazy"
      crossorigin="anonymous"
      async>
  </script>
</section>
{{- end }}
